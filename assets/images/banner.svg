<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500" role="img" aria-label="GetPayIn for WooCommerce">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#004C48"/>
      <stop offset="55%" stop-color="#00736D"/>
      <stop offset="100%" stop-color="#009C95"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#glow)"/>

  <!-- Logo group -->
  <g transform="translate(110,140) scale(1.05)" fill="#ffffff">
    <!-- Stylised P with arrow -->
    <g transform="scale(0.85)">
      <path d="M0 0h120c52 0 94 42 94 94s-42 94-94 94H56v74a18 18 0 0 1-18 18H18A18 18 0 0 1 0 262V0zm56 56v76h64a38 38 0 0 0 0-76H56z"/>
      <path d="M82 90h36l-15-15a6 6 0 0 1 8.485-8.485l25.728 25.728a6 6 0 0 1 0 8.485L111.485 126.456a6 6 0 0 1-8.485-8.485L118 103H82a6 6 0 1 1 0-13z"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(360,235)" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="120" font-weight="800" letter-spacing="-2">GetPayIn</text>
    <text x="6" y="80" font-size="38" font-weight="500" letter-spacing="2" opacity="0.85">for WooCommerce</text>
  </g>

  <!-- Subtle accent bar -->
  <rect x="0" y="488" width="1544" height="12" fill="#ffffff" opacity="0.10"/>
